; OpenCode 语音输入配置
; 修改后：语音服务需要重启（voicectl.cmd restart）；热键助手在托盘菜单点“重载配置”。

[meta]
; 配置版本（升级时用于补充/更新默认项，请勿手动改小）
version=5

[ui]
; 界面外观：auto（跟随系统）/ light（浅色）/ dark（深色）
theme=auto

[voice]
; 本地服务端口（改端口后需要重启服务；插件读取本文件或同目录 config.json）
port=17860
; 麦克风：留空=系统默认；也可填设备序号或名称片段，例如 1 或 EDIFIER
device=
; 识别语言：留空=自动；可填 Chinese / English
language=
; 长按判定前多保留的音频（毫秒），避免吞掉第一个字
preroll_ms=500
; 模型目录：留空=同目录 models\Qwen3-ASR-1.7B
model_dir=
; 单次录音上限（秒），到点助手会自动结束并粘贴
max_record_seconds=60
; 计算设备：auto（有显卡用显卡）/ cuda（强制显卡）/ cpu（强制 CPU，省显存）
; 切到 cpu 时服务会重启（保证显存完全释放），并自动关闭实时预览
compute=auto
; CPU 模式的加载精度：fp32（默认，速度优先）/ bf16（省约 6GB 内存，转写慢约 3.4 倍）
; 也可用环境变量 OPENCODE_VOICE_CPU_DTYPE=bf16 覆盖；显卡模式固定 bf16，不受影响
cpu_dtype=fp32
; 实时预览（分段增量识别）
partial_enabled=1
; 预览刷新间隔（毫秒）：越小越跟手，太小会一直占用 GPU
partial_interval_ms=280
; 新增音频超过多少毫秒才重新识别（避免空转）
partial_min_growth_ms=150
; 首次出现预览文字所需的最短音频（毫秒）
partial_min_first_ms=300
; 段落长度（秒）：定稿后不再重复识别；越小预览越跟手、边界风险略高
segment_seconds=5
; 段落之间的重叠音频（毫秒），用于拼接去重
segment_overlap_ms=600

[overlay]
; 实时字幕悬浮窗
enabled=1
; 悬浮窗距离目标窗口底部的像素（越大越靠上）
offset_y=120
; 最多显示多少字（超出显示末尾）
max_chars=200
; 悬浮窗刷新间隔（毫秒）
poll_ms=150

[hotkey]
; 触发键：enter（回车键）或 xbutton2（鼠标侧键）
trigger=enter
; 长按多久算"语音输入"（毫秒）
hold_ms=350
; 临时关闭/恢复语音输入的快捷键（暂停后触发键完全恢复原生行为）
disable_hotkey=^!m
; 注入方式：paste（剪贴板 + Ctrl+V）
inject=paste
; 1 = 粘贴转写文本后自动按回车发送
auto_submit=0
; 1 = 粘贴后恢复原剪贴板内容
restore_clipboard=1
; 生效窗口：* = 所有窗口；也可写 ahk_exe OpenCode.exe，多个用 | 分隔
targets=*

[tasks]
; 安装器创建的计划任务名（留空则助手直接启动服务）
server_task=OpenCodeVoiceServer
hotkey_task=OpenCodeVoiceHotkey
